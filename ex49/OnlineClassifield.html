<html>
    <title>Bài tập 49</title>
<head>
    <meta charset="UTF-8">
    <title>Online Classifieds Search Form</title>
    <style>
        body {
            background-color: #d8f8ff;
            font-family: "Times New Roman", Times, serif;
            margin: 0;
            padding: 20px 0;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 520px;
            background-color: #d8f8ff;
            padding: 10px;
        }

        /* Tiêu đề chính */
        h1.form-title {
            color: red;
            font-size: 22px;
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 10px;
        }

        hr {
            border: 0;
            border-top: 1px solid #777;
            margin-bottom: 15px;
        }

        /* Câu hỏi/Mục */
        .question {
            font-weight: bold;
            font-size: 14px;
            margin-top: 12px;
            margin-bottom: 8px;
        }

        /* Lưới 2 cột cho Radio */
        .radio-grid {
            display: grid;
            grid-template-columns: 140px 180px;
            gap: 4px;
            font-size: 13px;
            margin-left: 10px;
        }

        /* Lưới 3 cột cho Checkbox */
        .checkbox-grid {
            display: grid;
            grid-template-columns: 150px 150px 160px;
            gap: 4px;
            font-size: 13px;
            margin-left: 10px;
        }

        .radio-grid label, .checkbox-grid label {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        /* Nhập ngày tháng & từ khóa */
        input[type="text"] {
            border: 1px solid #7f9db9;
            padding: 2px 4px;
            font-family: inherit;
            font-size: 13px;
            background-color: #fff;
        }

        .date-inputs {
            margin-left: 10px;
            font-size: 14px;
        }

        .keyword-input {
            margin-left: 10px;
        }

        .keyword-input input {
            width: 100%;
        }

        /* Nút chức năng ở cuối */
        .action-buttons {
            display: flex;
            gap: 30px;
            margin-top: 15px;
            margin-left: 10px;
        }

        .btn-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            border: none;
            background: none;
            font-family: inherit;
        }

        .btn-item .icon {
            font-size: 20px;
            font-weight: bold;
        }

        .btn-item.search { color: green; }
        .btn-item.help { color: blue; }
        .btn-item.cancel { color: #ff0066; }

        .btn-item span {
            font-size: 13px;
            font-weight: bold;
            margin-top: 2px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="form-title">Online Classifieds Search Form</h1>
    <hr>

    <form>
        <!-- Mục 1 -->
        <div class="question">1) Search for a classified in the following sections:</div>
        <div class="radio-grid">
            <label><input type="radio" name="section" value="Employment"> Employment</label>
            <label><input type="radio" name="section" value="Personal"> Personal</label>
            <label><input type="radio" name="section" value="For Sale" checked> For Sale</label>
            <label><input type="radio" name="section" value="Miscellaneous"> Miscellaneous</label>
            <label><input type="radio" name="section" value="Housing"> Housing</label>
            <label><input type="radio" name="section" value="All of the above"> All of the above</label>
        </div>

        <br>

        <!-- Mục 2 -->
        <div class="question">2) Search the following publications:</div>
        <div class="checkbox-grid">
            <label><input type="checkbox" name="pub" value="Midwest times" checked> Midwest times</label>
            <label><input type="checkbox" name="pub" value="Modern News"> Modern News</label>
            <label><input type="checkbox" name="pub" value="Employment Today"> Employment Today</label>
            <label><input type="checkbox" name="pub" value="Great Lakes Classifieds" checked> Great Lakes Classifieds</label>
            <label><input type="checkbox" name="pub" value="Middleton Daily"> Middleton Daily</label>
            <label><input type="checkbox" name="pub" value="Cashtown Daily News"> Cashtown Daily News</label>
        </div>

        <br>

        <!-- Mục 3 -->
        <div class="question">3) From to 
            <span class="date-inputs">
                <input type="text" value="mm/ydd/yy" style="width: 110px;"> to 
                <input type="text" value="mm/dd/yy" style="width: 110px;">.
            </span>
        </div>

        <!-- Mục 4 -->
        <div class="question">4) Enter a few keywords to describe the classified.</div>
        <div class="keyword-input">
            <input type="text">
        </div>

        <br>

        <!-- Mục 5 -->
        <div class="question">5) Click one of the options below:</div>
        <div class="action-buttons">
            <button type="submit" class="btn-item search">
                <span class="icon">&#10004;</span>
                <span>Search</span>
            </button>
            <button type="button" class="btn-item help">
                <span class="icon">?</span>
                <span>Help</span>
            </button>
            <button type="reset" class="btn-item cancel">
                <span class="icon">&#10006;</span>
                <span>Cancel</span>
            </button>
        </div>
    </form>
</div>

</body>
</html>
