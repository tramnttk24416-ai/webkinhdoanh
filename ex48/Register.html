<html>
    <title>Bài tập 48</title>
<head>
    <meta charset="UTF-8">
    <title>Registration Form - Jackson Electronics</title>
    <style>
        body {
            background-color: #8dbbf8;
            font-family: "Times New Roman", Times, serif;
            margin: 0;
            padding: 20px 0;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 520px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Title */
        h2.form-title {
            font-size: 24px;
            margin: 5px 0;
            text-align: center;
        }

        p.subtitle {
            font-size: 14px;
            margin-bottom: 15px;
            text-align: center;
        }

        /* Form styling */
        form {
            width: 100%;
        }

        .form-row {
            margin-bottom: 6px;
            display: flex;
            align-items: center;
        }

        .label-col {
            width: 140px;
            font-size: 14px;
        }

        input[type="text"], select, textarea {
            border: 1px solid #7f9db9;
            padding: 2px;
            font-family: inherit;
            font-size: 13px;
            background-color: #fff;
        }

        /* Horizontal rule */
        hr {
            border: 0;
            border-top: 1px solid #666;
            margin: 15px 0;
        }

        /* Radio & Checkbox Grid layout */
        .options-grid {
            display: grid;
            grid-template-columns: 140px 180px;
            gap: 4px;
            font-size: 13px;
        }

        .options-grid label {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        textarea {
            width: 280px;
            height: 100px;
            resize: vertical;
        }

        /* Buttons */
        .buttons {
            text-align: center;
            margin-top: 15px;
        }

        .buttons input {
            background-color: #f0f0f0;
            border: 1px solid #707070;
            padding: 2px 10px;
            font-size: 12px;
            margin: 0 3px;
            cursor: pointer;
        }

        .buttons input:hover {
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header Logo -->
    <div style="text-align: center; margin-bottom: 20px;">
        <img src="Jackson.gif" alt="Jackson Electronics Logo" style="max-width: 300px;">
    </div>

    <!-- Title -->
    <h2 class="form-title">Registration Form</h2>
    <p class="subtitle">Register your Jackson Electronics product here</p>

    <!-- Form content -->
    <form>
        <!-- First & Last Name -->
        <div class="form-row">
            <div class="label-col">First Name:</div>
            <input type="text" style="width: 100px;">
            <span style="font-size: 14px; margin: 0 5px 0 10px;">Last Name:</span>
            <input type="text" style="width: 100px;">
        </div>

        <!-- Address #1 -->
        <div class="form-row">
            <div class="label-col">Address #1:</div>
            <input type="text" style="width: 200px;">
        </div>

        <!-- Address #2 -->
        <div class="form-row">
            <div class="label-col">Address #2:</div>
            <input type="text" style="width: 200px;">
        </div>

        <!-- City, State, Zip -->
        <div class="form-row">
            <div class="label-col">City:</div>
            <input type="text" style="width: 130px;">
            <span style="font-size: 14px; margin: 0 5px;">State:</span>
            <input type="text" style="width: 35px;">
            <span style="font-size: 14px; margin: 0 5px;">Zip:</span>
            <input type="text" style="width: 60px;">
        </div>

        <!-- Country -->
        <div class="form-row">
            <div class="label-col">Country:</div>
            <input type="text" value="United States" style="width: 130px;">
        </div>

        <hr>

        <!-- Product -->
        <div class="form-row">
            <div class="label-col">Product:</div>
            <select style="width: 110px;">
                <option value="ScanMaster" selected>ScanMaster</option>
                <option value="LaserPrinter">LaserPrinter</option>
                <option value="DigitalCamera">DigitalCamera</option>
            </select>
        </div>

        <!-- Date Purchased -->
        <div class="form-row">
            <div class="label-col">Date Purchased:</div>
            <input type="text" style="width: 130px;">
        </div>

        <!-- Serial # -->
        <div class="form-row">
            <div class="label-col">Serial #:</div>
            <input type="text" style="width: 130px;">
        </div>

        <!-- Used for -->
        <div class="form-row" style="align-items: flex-start;">
            <div class="label-col">Used for:</div>
            <div class="options-grid">
                <label><input type="radio" name="used_for" value="Home"> Home</label>
                <label><input type="radio" name="used_for" value="Educational Institution"> Educational Institution</label>
                <label><input type="radio" name="used_for" value="Business" checked> Business</label>
                <label><input type="radio" name="used_for" value="Other"> Other</label>
                <label><input type="radio" name="used_for" value="Government"> Government</label>
            </div>
        </div>

        <br>

        <!-- System -->
        <div class="form-row" style="align-items: flex-start;">
            <div class="label-col">System (check all that apply):</div>
            <div class="options-grid">
                <label><input type="checkbox" name="system" value="Windows"> Windows</label>
                <label><input type="checkbox" name="system" value="UNIX"> UNIX</label>
                <label><input type="checkbox" name="system" value="Macintosh"> Macintosh</label>
                <label><input type="checkbox" name="system" value="Other"> Other</label>
            </div>
        </div>

        <hr>

        <!-- Comments -->
        <div class="form-row" style="align-items: flex-start;">
            <div class="label-col">Comments?:</div>
            <textarea></textarea>
        </div>

        <!-- Buttons -->
        <div class="buttons">
            <input type="submit" value="Click to register">
            <input type="reset" value="Click to cancel">
        </div>
    </form>
</div>

</body>
</html>
